# /etc/nginx/sites-available/bedroom-planner  (mirrored in github.com/DavidTeju/projects-vps)
server {
    listen 80;
    listen [::]:80;
    server_name bedroom.davidteju.dev;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        try_files $uri =404;
    }

    location / {
        return 308 https://bedroom.davidteju.dev$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name bedroom.davidteju.dev;

    ssl_certificate /etc/letsencrypt/live/bedroom.davidteju.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bedroom.davidteju.dev/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    server_tokens off;
    gzip on;
    gzip_types text/css application/javascript application/json;

    root /srv/bedroom-planner/current;
    index index.html;

    # A block with its own add_header drops the http-level ones, so include the shared set
    # (HSTS, nosniff, Referrer-Policy) explicitly.
    include snippets/security-headers.conf;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    # File names carry no content hash, so browsers revalidate and a deploy shows at once.
    add_header Cache-Control "no-cache" always;

    location = /robots.txt {
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
